name: validate
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skills, agents, rules and hooks
        run: python3 scripts/validate.py
      - name: Hook tests
        run: python3 -m unittest discover -s tests
